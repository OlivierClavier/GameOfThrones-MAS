<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="617px" preserveAspectRatio="none" style="width:629px;height:617px;background:#FFFFFF;" version="1.1" viewBox="0 0 629 617" width="629px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="Arial" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="258" x="178.5" y="23.1318">Diagramme d'&#233;tats d'un agent mobile</text><g id="Exploration"><rect fill="#F1F1F1" height="63.6963" rx="12.5" ry="12.5" style="stroke:#555555;stroke-width:0.5;" width="290" x="119" y="154.0986"/><line style="stroke:#555555;stroke-width:0.5;" x1="119" x2="409" y1="180.1973" y2="180.1973"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="70" x="229" y="172.2305">Exploration</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="203" x="124" y="196.4531">direction et distance tir&#233;es au hasard</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="270" x="124" y="210.252">perd des EP &#224; chaque case hors de sa SafeZone</text></g><g id="Retour"><rect fill="#F1F1F1" height="63.6963" rx="12.5" ry="12.5" style="stroke:#555555;stroke-width:0.5;" width="187" x="170.5" y="309.0986"/><line style="stroke:#555555;stroke-width:0.5;" x1="170.5" x2="357.5" y1="335.1973" y2="335.1973"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="43" x="242.5" y="327.2305">Retour</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="147" x="175.5" y="351.4531">se dirige vers sa SafeZone</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="167" x="175.5" y="365.252">(Map.getDirectionToSafeZone)</text></g><g id="Repos"><rect fill="#F1F1F1" height="63.6963" rx="12.5" ry="12.5" style="stroke:#555555;stroke-width:0.5;" width="190" x="7" y="464.0986"/><line style="stroke:#555555;stroke-width:0.5;" x1="7" x2="197" y1="490.1973" y2="490.1973"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="41" x="81.5" y="482.2305">Repos</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="165" x="12" y="506.4531">immobile &#224; c&#244;t&#233; de son Ma&#238;tre</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="170" x="12" y="520.252">r&#233;cup&#232;re des EP &#224; chaque pas</text></g><g id="Epuise"><rect fill="#F1F1F1" height="63.6963" rx="12.5" ry="12.5" style="stroke:#555555;stroke-width:0.5;" width="159" x="358.5" y="464.0986"/><line style="stroke:#555555;stroke-width:0.5;" x1="358.5" x2="517.5" y1="490.1973" y2="490.1973"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="43" x="416.5" y="482.2305">&#201;puis&#233;</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="106" x="363.5" y="506.4531">devient un obstacle</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="139" x="363.5" y="520.252">perd tous ses messages</text></g><ellipse cx="264" cy="53.0986" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="438" cy="600.0986" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="438" cy="600.0986" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><!--link *start* to Exploration--><g id="link_*start*_Exploration"><path d="M264,63.0986 C264,81.5386 264,118.3586 264,148.0186 " fill="none" id="*start*-to-Exploration" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="264,154.0186,268,145.0186,264,149.0186,260,145.0186,264,154.0186" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="143" x="265" y="106.2925">plac&#233; dans sa SafeZone,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="97" x="288" y="121.2412">EP au maximum</text></g><!--link Exploration to Exploration--><g id="link_Exploration_Exploration"><path d="M409.13,173.2786 C429.98,175.3286 444,179.6086 444,186.0986 C444,192.5886 435.9512,196.2815 415.1012,198.3315 " fill="none" id="Exploration-to-Exploration" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="409.13,198.9186,418.4782,202.0188,414.106,198.4294,417.6954,194.0572,409.13,198.9186" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="166" x="450" y="183.7925">rencontre (partage, &#233;change,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="149" x="458.5" y="198.7412">confrontation) ou obstacle</text></g><!--link Exploration to Retour--><g id="link_Exploration_Retour"><path d="M227.48,218.1086 C219.56,226.9086 212.28,237.1186 208,248.0986 C203,260.9386 203,266.2586 208,279.0986 C212.28,290.0786 215.5462,295.8289 223.4662,304.6289 " fill="none" id="Exploration-to-Retour" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="227.48,309.0886,224.4325,299.7231,224.1352,305.3722,218.4861,305.0748,227.48,309.0886" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="64" x="209" y="268.7925">EP &lt; 20 %</text></g><!--link Retour to Exploration--><g id="link_Retour_Exploration"><path d="M272.56,308.9886 C274.8,299.4686 276.89,288.9186 278,279.0986 C279.55,265.4086 279.55,261.7886 278,248.0986 C276.89,238.2786 276.1742,233.5691 273.9342,224.0491 " fill="none" id="Retour-to-Exploration" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="272.56,218.2086,270.7277,227.8855,273.7052,223.0757,278.515,226.0532,272.56,218.2086" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="72" x="297" y="261.2925">EP &gt;= 80 %</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="104" x="281" y="276.2412">dans sa SafeZone</text></g><!--link Retour to Retour--><g id="link_Retour_Retour"><path d="M357.56,327.2686 C377.81,328.6186 392.5,333.2286 392.5,341.0986 C392.5,348.9686 383.7967,353.1795 363.5467,354.5295 " fill="none" id="Retour-to-Retour" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="357.56,354.9286,366.8061,358.3211,362.5489,354.596,366.274,350.3388,357.56,354.9286" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="88" x="408" y="338.7925">bloqu&#233; : essaie</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="107" x="398.5" y="353.7412">une autre direction</text></g><!--link Retour to Repos--><g id="link_Retour_Repos"><path d="M230.83,373.4286 C202.78,399.9186 167.1726,433.5494 139.2126,459.9494 " fill="none" id="Retour-to-Repos" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="134.85,464.0686,144.14,460.7982,138.4855,460.636,138.6478,454.9814,134.85,464.0686" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="70" x="203.5" y="416.2925">arriv&#233; &#224; c&#244;t&#233;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="79" x="199" y="431.2412">de son Ma&#238;tre</text></g><!--link Repos to Exploration--><g id="link_Repos_Exploration"><path d="M87.63,464.0786 C71.97,425.3986 52.47,358.3786 79,309.0986 C101.34,267.5986 139.302,240.5789 178.412,220.8689 " fill="none" id="Repos-to-Exploration" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="183.77,218.1686,173.9328,218.647,179.305,220.4188,177.5331,225.791,183.77,218.1686" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="72" x="80" y="346.2925">EP &gt;= 80 %</text></g><!--link Exploration to Epuise--><g id="link_Exploration_Epuise"><path d="M390.46,218.1486 C437.15,236.4686 485.18,265.0386 512,309.0986 C542.9,359.8586 503.369,421.2127 471.149,459.4027 " fill="none" id="Exploration-to-Epuise" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="467.28,463.9886,476.1408,459.6891,470.5042,460.167,470.0263,454.5304,467.28,463.9886" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="41" x="523" y="346.2925">EP = 0</text></g><!--link Retour to Epuise--><g id="link_Retour_Epuise"><path d="M299.63,373.4286 C329.76,399.9186 368.1844,433.7064 398.2044,460.1064 " fill="none" id="Retour-to-Epuise" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="402.71,464.0686,398.5931,455.1215,398.9553,460.7667,393.3101,461.1289,402.71,464.0686" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="41" x="368" y="423.7925">EP = 0</text></g><!--link Epuise to *end*--><g id="link_Epuise_*end*"><path d="M438,528.2586 C438,548.8786 438,568.6286 438,582.7086 " fill="none" id="Epuise-to-*end*" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="438,588.7086,442,579.7086,438,583.7086,434,579.7086,438,588.7086" style="stroke:#181818;stroke-width:1.0;"/></g><!--SRC=[VL9DRzD04BtxLuoAK1FKH1KI4gfe9KhXH142JcquJEo9lSAxw-v7rB_0l-18Bfpu1_vZFDk9PJiLFjYpddapxyrR_qEPYXrhocJ3iGmVh0cVM0kzTOhB9AXG2jqepb63lzbflGiSF89eY7CnWRHTgrAIqoVA5i6nyIeeQvw0q4oZhB2Pq4UrLIQ_5hoMscvblanyJysZbLnRbubxPqlhwDchzacIDaCdxnyh_EPcp