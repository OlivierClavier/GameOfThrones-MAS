<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="661px" preserveAspectRatio="none" style="width:603px;height:661px;background:#FFFFFF;" version="1.1" viewBox="0 0 603 661" width="603px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="Arial" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="264" x="162.75" y="24.9659">Diagramme d'&#233;tats d'un agent mobile</text><g id="Exploration"><rect fill="#F1F1F1" height="71.7561" rx="12.5" ry="12.5" style="stroke:#555555;stroke-width:0.5;" width="286" x="90.5" y="163.0679"/><line style="stroke:#555555;stroke-width:0.5;" x1="90.5" x2="376.5" y1="192.1358" y2="192.1358"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="76" x="195.5" y="183.0339">Exploration</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="207" x="95.5" y="209.9639">direction et distance tir&#233;es au hasard</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="266" x="95.5" y="226.308">perd des EP &#224; chaque case hors de sa SafeZone</text></g><g id="Retour"><rect fill="#F1F1F1" height="71.7561" rx="12.5" ry="12.5" style="stroke:#555555;stroke-width:0.5;" width="192" x="137.5" y="331.8279"/><line style="stroke:#555555;stroke-width:0.5;" x1="137.5" x2="329.5" y1="360.8958" y2="360.8958"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="45" x="211" y="351.7939">Retour</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="147" x="142.5" y="378.7239">se dirige vers sa SafeZone</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="172" x="142.5" y="395.068">(Map.getDirectionToSafeZone)</text></g><g id="Repos"><rect fill="#F1F1F1" height="71.7561" rx="12.5" ry="12.5" style="stroke:#555555;stroke-width:0.5;" width="189" x="7" y="500.5779"/><line style="stroke:#555555;stroke-width:0.5;" x1="7" x2="196" y1="529.6458" y2="529.6458"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="41" x="81" y="520.5439">Repos</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="169" x="12" y="547.4739">immobile &#224; c&#244;t&#233; de son Ma&#238;tre</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="168" x="12" y="563.818">r&#233;cup&#232;re des EP &#224; chaque pas</text></g><g id="Epuise"><rect fill="#F1F1F1" height="71.7561" rx="12.5" ry="12.5" style="stroke:#555555;stroke-width:0.5;" width="155" x="339" y="500.5779"/><line style="stroke:#555555;stroke-width:0.5;" x1="339" x2="494" y1="529.6458" y2="529.6458"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="45" x="394" y="520.5439">&#201;puis&#233;</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="108" x="344" y="547.4739">devient un obstacle</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="135" x="344" y="563.818">perd tous ses messages</text></g><ellipse cx="233.5" cy="56.0679" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="416.5" cy="644.3379" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="416.5" cy="644.3379" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><!--link *start* to Exploration--><g id="link_*start*_Exploration"><path d="M233.5,66.3079 C233.5,85.5379 233.5,124.6879 233.5,156.7379 " fill="none" id="*start*-to-Exploration" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="233.5,162.7379,237.5,153.7379,233.5,157.7379,229.5,153.7379,233.5,162.7379" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="140" x="234.5" y="110.9649">plac&#233; dans sa SafeZone,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="97" x="256" y="128.6709">EP au maximum</text></g><!--link Exploration to Exploration--><g id="link_Exploration_Exploration"><path d="M376.66,184.6679 C397.48,186.9379 411.5,191.6979 411.5,198.9479 C411.5,206.1979 403.4447,210.3076 382.6247,212.5776 " fill="none" id="Exploration-to-Exploration" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="376.66,213.2279,386.0405,216.2289,381.6305,212.686,385.1734,208.276,376.66,213.2279" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="173" x="417.5" y="195.3449">rencontre (partage, &#233;change,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="159" x="424.5" y="213.0509">confrontation) ou obstacle</text></g><!--link Exploration to Retour--><g id="link_Exploration_Retour"><path d="M198.45,235.0179 C191.52,244.0279 185.23,254.1979 181.5,264.8279 C176.05,280.3379 176.05,286.3079 181.5,301.8279 C185.23,312.4479 187.862,317.862 194.792,326.872 " fill="none" id="Exploration-to-Retour" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="198.45,331.6279,196.1336,322.0553,195.4017,327.6646,189.7924,326.9327,198.45,331.6279" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="56" x="182.5" y="288.7249">EP &lt; 20 %</text></g><!--link Retour to Exploration--><g id="link_Retour_Exploration"><path d="M239.93,331.4579 C241.41,321.8779 242.76,311.4879 243.5,301.8279 C244.76,285.4279 244.76,281.2179 243.5,264.8279 C242.76,255.1679 242.3261,250.6976 240.8461,241.1176 " fill="none" id="Retour-to-Exploration" style="stroke:#181818;stroke-wi